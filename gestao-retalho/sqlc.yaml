version: "2"
sql:
  - engine: "sqlite"
    schema: "backend/repository/migrations"
    queries: "backend/repository/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "backend/repository/sqlcgen"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: true
